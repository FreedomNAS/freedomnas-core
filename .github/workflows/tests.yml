name: tests

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    steps:
      - name: Install git for the checkout
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git procps python3 python3-pytest python3-yaml python3-cryptography

      - name: Fetch the profiles and the installer the tests check against
        run: |
          for repo in freedomnas-profiles freedomnas-installer; do
            git clone --depth 1 --branch dev \
              "https://github.com/FreedomNAS/$repo.git" "$(dirname "$PWD")/$repo"
          done

      - name: Test
        run: python3 -m pytest tests/ -q
