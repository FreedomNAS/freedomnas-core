name: tests

# The suite runs twice: once on pure Python, once on Nim (FREEDOMNAS_ENGINE
# also moves the configuration manager, since FREEDOMNAS_CONFIG follows it).
# The parity suites are what make the second run meaningful — they ask both
# implementations the same questions and compare the answers, the failures
# and, for the configuration, the bytes written.

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  pytest:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git gcc nim python3 python3-pytest python3-yaml python3-cryptography

      - name: Fetch the profiles the tests translate against
        run: |
          git clone --depth 1 --branch dev \
            https://codeberg.org/FreedomNAS/freedomnas-profiles.git \
            "$(dirname "$PWD")/freedomnas-profiles"

      - name: Build the native engine
        run: cd nim && nimble -y native

      - name: Python engine and config
        run: python3 -m pytest tests/ -q

      - name: Native engine and config
        run: FREEDOMNAS_ENGINE=native python3 -m pytest tests/ -q

      - name: Mixed — native engine, PyYAML config
        run: FREEDOMNAS_ENGINE=native FREEDOMNAS_CONFIG=python python3 -m pytest tests/ -q
