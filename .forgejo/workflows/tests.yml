name: tests

# The suite runs twice: once on the pure-Python engine, once on the Nim one.
# tests/test_engine_parity.py is what makes the second run meaningful — it
# asks both engines the same questions and compares the answers, failures
# included.

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  pytest:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git gcc nim python3 python3-pytest python3-yaml python3-cryptography

      - name: Fetch the profiles the tests translate against
        run: |
          git clone --depth 1 --branch dev \
            https://codeberg.org/FreedomNAS/freedomnas-profiles.git \
            "$(dirname "$PWD")/freedomnas-profiles"

      - name: Build the native engine
        run: cd nim && nimble -y native

      - name: Python engine
        run: python3 -m pytest tests/ -q

      - name: Native engine
        run: FREEDOMNAS_ENGINE=native python3 -m pytest tests/ -q
