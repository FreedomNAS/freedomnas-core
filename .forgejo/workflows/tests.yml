name: tests

# Every ported module has its own backend variable, following
# FREEDOMNAS_ENGINE when unset. The suite runs on pure Python, on Nim, on
# Nim with each module pinned back to Python in turn (the rollback path),
# and on the Python engine with every module asking for Nim (they must
# follow the engine back). The parity suites are what make the native runs
# meaningful — they compare results, failures and, for what is written to
# disk, the bytes.

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  pytest:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git gcc nim python3 python3-pytest python3-yaml python3-cryptography

      - name: Fetch the profiles the tests translate against
        run: |
          git clone --depth 1 --branch dev \
            https://codeberg.org/FreedomNAS/freedomnas-profiles.git \
            "$(dirname "$PWD")/freedomnas-profiles"

      - name: Build the native engine
        run: cd nim && nimble -y native

      - name: Python
        run: python3 -m pytest tests/ -q

      - name: Native
        run: FREEDOMNAS_ENGINE=native python3 -m pytest tests/ -q

      - name: Native engine, each module pinned back to Python
        run: |
          set -e
          for module in CONFIG SNAPSHOTS POOLS SHADOW RECONCILE KEYMGMT PACKAGES; do
            echo "--- FREEDOMNAS_ENGINE=native FREEDOMNAS_${module}=python"
            env FREEDOMNAS_ENGINE=native "FREEDOMNAS_${module}=python" \
              python3 -m pytest tests/ -q
          done

      - name: Python engine, every module asking for native
        run: |
          env FREEDOMNAS_ENGINE=python FREEDOMNAS_CONFIG=native \
            FREEDOMNAS_SNAPSHOTS=native FREEDOMNAS_POOLS=native \
            FREEDOMNAS_SHADOW=native FREEDOMNAS_RECONCILE=native \
            FREEDOMNAS_KEYMGMT=native FREEDOMNAS_PACKAGES=native \
            python3 -m pytest tests/ -q
